# Applied after dsh-base and dsh-acp-app at the pinned fork commit.
# ACP creates agents from the host plane; it does not select agent presets.
- id: system-prompt
  config:
    personaPrefix: '你是 QQ 聊天助手。自然、简洁地交流，仅使用当前 QQ 会话挂载的工具。'
    includeRuntimeContext: false
    includeHarnessIdentity: false
- id: acp
  config:
    provider: deepseek-account
    model: deepseek-flash
- id: sandbox-policy
  config:
    mode: read-only
- id: approval
  config:
