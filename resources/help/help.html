<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 860px;
      background: linear-gradient(180deg, #eef4ff 0%, #f7f8fb 340px, #f7f8fb 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      color: #1f2430;
      zoom: 1.25;
    }
    .page { padding: 26px 28px 22px; }
    .hero { display: flex; align-items: baseline; gap: 14px; margin: 2px 0 18px; }
    .hero-title { font-size: 34px; font-weight: 700; color: #1b4d8f; letter-spacing: .5px; }
    .hero-sub { font-size: 16px; color: #6b7686; }
    .card {
      background: #ffffff;
      border: 1px solid #e3e8f0;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(27, 77, 143, .06);
      padding: 10px 18px 4px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 19px;
      font-weight: 700;
      color: #1b4d8f;
      padding: 6px 2px 10px;
      border-bottom: 2px solid #eaf0f9;
      margin-bottom: 2px;
    }
    .row { display: flex; align-items: baseline; gap: 18px; padding: 9px 2px; border-bottom: 1px dashed #edf1f7; }
    .row:last-child { border-bottom: none; }
    .cmd {
      flex: 0 0 300px;
      font-size: 17px;
      font-weight: 600;
      color: #2a5fa8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .desc { font-size: 16px; color: #5b6575; line-height: 1.45; }
    .foot {
      text-align: center;
      font-size: 14px;
      color: #8a94a6;
      padding: 8px 0 4px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="hero-title">DSH-Chat</div>
      <div class="hero-sub">QQ × 本地 DSH 后端 · 指令列表</div>
    </div>

    {{each groups group}}
    <section class="card">
      <div class="card-title">{{group.title}}</div>
      {{each group.items item}}
      <div class="row">
        <div class="cmd">{{item.cmd}}</div>
        <div class="desc">{{item.desc}}</div>
      </div>
      {{/each}}
    </section>
    {{/each}}

    <div class="foot">v{{version}} · 「主人」命令仅主人可用 · 命令各部分之间的空格可省略</div>
  </div>
</body>
</html>
